; EspStation firmware — ESP-IDF via PlatformIO.
;
; One firmware, many targets. `esp32dev` is the board on the bench today
; (WROOM DevKit v1, CP2102 bridge); the others are declared now so that adding
; the hardware later is a `-e` flag, not a port. Target-specific behaviour goes
; behind the capability HAL in esps_core, never behind #ifdef in logic.

[platformio]
default_envs = esp32dev
src_dir = main

[env]
platform = espressif32@^6.9.0
framework = espidf
monitor_speed = 115200
build_flags =
    -Wall -Wextra
    -DESPS_FW_VERSION=\"0.1.0\"
check_tool = cppcheck
check_flags = --enable=warning,performance --inline-suppr

[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32c6]
; ESP32-C6 needs an IDF >= 5.1 platform build; if this env fails to resolve,
; bump the [env] platform pin rather than special-casing here.
board = esp32-c6-devkitc-1
