# Every gate a contributor is otherwise expected to remember.
#
# The ordering is deliberate: the cheap gates that catch the most damaging
# mistakes run first. Protocol drift and the host codec tests take seconds and
# guard the wire format, which is the thing that breaks silently and shows up
# later as corrupted telemetry on hardware.
#
# What is NOT here, on purpose:
#   * no flashing or hardware steps — no ESP32 is reachable from CI, so those
#     stay operator-verified and the roadmap says so rather than pretending.
#   * no packaging (`npm run dist`) — that belongs to a release workflow, not
#     to every push.
#   * no lint gate — there is no lint config to enforce yet, and a red CI on
#     style trains people to ignore CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (protocol + agent roles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml
      - name: Protocol drift + agent-role sync
        run: make contracts

  firmware-host:
    name: firmware codec (host, gcc + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: make fw-test

  firmware-build:
    name: firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # esp32dev is the board on the bench. esp32c3 is declared in
        # platformio.ini (D-13) and building it here is the only validation it
        # gets until the hardware exists — worth having, not a substitute.
        #
        # The two dio variants compile code that esp32dev does not: the
        # interrupt handlers, the bit-bang transmitter and the receiver task
        # are all behind ESPS_DIO_ROLE, so without these entries a change that
        # breaks them passes CI. Building them is not a substitute for the
        # bench either — nothing here proves an edge ever reaches a wire.
        env: [esp32dev, esp32c3, esp32dev_dio_a, esp32dev_dio_b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.env }}

  gateway:
    name: gateway (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the compatibility target; 3.12 guards against the next bump.
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - name: Install
        working-directory: gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: pytest
        working-directory: gateway
        run: python -m pytest tests/ -q
      # Third implementation of the two-wire link (Arduino sketch): same golden
      # vectors and counters as esps_dio and dio_link.py. Lives in this job
      # because it needs the installed gateway package and the runner's g++.
      - name: bench sketch N3 (host, vs SPEC-LINK + dio_link)
        run: make bench-test GW_PY=python

  desktop:
    name: desktop (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Build
        working-directory: desktop
        run: npm run build
