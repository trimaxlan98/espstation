# Every gate a contributor is otherwise expected to remember.
#
# The ordering is deliberate: the cheap gates that catch the most damaging
# mistakes run first. Protocol drift and the host codec tests take seconds and
# guard the wire format, which is the thing that breaks silently and shows up
# later as corrupted telemetry on hardware.
#
# What is NOT here, on purpose:
#   * no flashing or hardware steps — no ESP32 is reachable from CI, so those
#     stay operator-verified and the roadmap says so rather than pretending.
#   * no packaging (`npm run dist`) — that belongs to a release workflow, not
#     to every push.
#   * no lint gate — there is no lint config to enforce yet, and a red CI on
#     style trains people to ignore CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (protocol + agent roles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml
      - name: Protocol drift gate
        run: python3 tools/check_protocol.py
      - name: Agent definitions in sync
        run: python3 tools/sync_agents.py --check

  firmware-host:
    name: firmware codec (host, gcc + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: make -C firmware/test/host test

  firmware-build:
    name: firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # esp32dev is the board on the bench. The others are declared in
        # platformio.ini (D-13) and building them here is the only validation
        # they get until the hardware exists — worth having, not a substitute.
        env: [esp32dev, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.env }}

  gateway:
    name: gateway (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the compatibility target; 3.12 guards against the next bump.
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - name: Install
        working-directory: gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: pytest
        working-directory: gateway
        run: python -m pytest tests/ -q

  desktop:
    name: desktop (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Build
        working-directory: desktop
        run: npm run build
