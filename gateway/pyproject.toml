[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espstation-gateway"
version = "0.1.0"
description = "EspStation station-side gateway: ENLP codec, transports, REST+WS API."
requires-python = ">=3.11"
license = { text = "MIT" }

# Kept short on purpose (see gateway builder brief): the gateway's job is
# codec + transports + a small API surface, not a framework showcase.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyserial>=3.5",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
espstation-gateway = "espstation_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["espstation_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
